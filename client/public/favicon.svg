<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!--
    WebChat Favicon
    Exact same geometry as WebChatLogo.tsx.
    Solid white fill + accent stroke so the icon is clearly visible
    on both light and dark browser-tab backgrounds.
  -->

  <!-- Speech bubble — solid semi-transparent white fill -->
  <path
    fill="#ffffff"
    fill-opacity="0.15"
    d="M6 4C4.895 4 4 4.895 4 6L4 20C4 21.105 4.895 22 6 22L13 22L15.5 25.5C15.776 25.875 16.224 25.875 16.5 25.5L19 22L26 22C27.105 22 28 21.105 28 20L28 6C28 4.895 27.105 4 26 4Z"
  />

  <!-- Speech bubble — solid white stroke outline -->
  <path
    stroke="#ffffff"
    stroke-width="2"
    stroke-linejoin="round"
    stroke-linecap="round"
    fill="none"
    d="M6 4C4.895 4 4 4.895 4 6L4 20C4 21.105 4.895 22 6 22L13 22L15.5 25.5C15.776 25.875 16.224 25.875 16.5 25.5L19 22L26 22C27.105 22 28 21.105 28 20L28 6C28 4.895 27.105 4 26 4Z"
  />

  <!-- "W" mark — white stroke, same as navbar icon -->
  <polyline
    points="10,10 12.5,16 16,12 19.5,16 22,10"
    stroke="#ffffff"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
</svg>